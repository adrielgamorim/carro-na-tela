# Cloudflare Worker do site: serve o build (dist/) e o proxy da FIPE em
# /api/fipe (worker/index.ts). Ver README, seção "Publicação".
name = "carro-na-tela"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Rotas do app (?versao=…, ?view=consulta) caem no index.html.
not_found_handling = "single-page-application"
# Só o proxy passa pelo código; o resto sai direto dos arquivos estáticos, sem
# contar no limite de requisições do Worker.
run_worker_first = ["/api/*"]

[vars]
# Site e proxy no mesmo domínio: nenhuma outra origem precisa chamar o proxy.
# Para liberar outra (separadas por vírgula): ALLOWED_ORIGINS = "https://outro.site"
ALLOWED_ORIGINS = ""

# As chaves da FIPE ficam como segredos, fora deste arquivo (painel da
# Cloudflare ou `npx wrangler secret put FIPE_PROXY_TOKEN`). Localmente,
# `npx wrangler dev` lê o .env.
#
# O cache das respostas da FIPE (caches.default) só tem efeito num domínio
# próprio; em *.workers.dev as gravações de cache são ignoradas.
