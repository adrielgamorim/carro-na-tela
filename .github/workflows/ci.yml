# Lint, tests and the production build (which runs tsc -b) on every push and
# pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Typecheck e build
        run: npm run build
