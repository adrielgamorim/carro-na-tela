# Daily catalog update (npm run daily) on GitHub's runners instead of a local
# PC: crawl the FIPE with the keys in the repository secrets, refresh the
# fleet, fuel prices and the index, then commit the data to main.
#
# The FIPE answers (.cache/fipe) and the Senatran zip (.cache/frota) are kept
# in the Actions cache between runs, so the crawl resumes where it stopped.
name: Atualização diária

on:
  schedule:
    - cron: "0 4 * * *" # 01:00 em Brasília (o GitHub tem atrasado para 11–12 UTC)
    # A second run: each FIPE key's quota lasts 24 h from its first use, so a
    # run the delay starts before yesterday's finds the keys spent; this one
    # gets them once they are back. With the keys spent it stops in minutes,
    # and `concurrency` queues it behind a run still going.
    - cron: "0 18 * * *" # 15:00 em Brasília
  workflow_dispatch:

# Pushes go through the deploy key; the token only reads.
permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # The deploy key (scripts/setup-github-daily.sh) is the ruleset's exception
      # that lets this job push the data to main.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DAILY_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Restaurar o cache da FIPE e da frota
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: daily-${{ github.run_id }}
          restore-keys: daily-

      # The snapshot is rebuilt from the whole cache: an empty one would restart
      # the crawl from scratch. The first run (or one after the cache expires,
      # 7 days unused) starts from the seed attached to the "cache-semente" release.
      - name: Semente do cache da FIPE
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cache-semente --pattern fipe-cache.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p .cache
          tar -xzf "$RUNNER_TEMP/fipe-cache.tar.gz" -C .cache

      - name: Atualização diária
        id: daily
        # One source failing (e.g. gov.br refusing the runner) must not keep
        # the others from being published; the run is marked failed at the end.
        continue-on-error: true
        env:
          FIPE_TOKEN: ${{ secrets.FIPE_TOKEN }}
          FIPE_TOKEN1: ${{ secrets.FIPE_TOKEN1 }}
          FIPE_TOKEN2: ${{ secrets.FIPE_TOKEN2 }}
          FIPE_TOKEN3: ${{ secrets.FIPE_TOKEN3 }}
          FIPE_TOKEN4: ${{ secrets.FIPE_TOKEN4 }}
          FIPE_TOKEN5: ${{ secrets.FIPE_TOKEN5 }}
          FIPE_TOKEN6: ${{ secrets.FIPE_TOKEN6 }}
          FIPE_TOKEN7: ${{ secrets.FIPE_TOKEN7 }}
          FIPE_TOKEN8: ${{ secrets.FIPE_TOKEN8 }}
        run: |
          # A lock left by a killed run would make this one skip.
          rm -f .cache/daily.lock
          node scripts/catalog/daily.ts

      - name: Guardar o cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: daily-${{ github.run_id }}

      - name: Conferir o build com os dados novos
        run: npm run build

      - name: Publicar os dados no main
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/catalog
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Atualização diária $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The site (Cloudflare Worker, wrangler.toml) with the build checked above.
      # Its FIPE key (FIPE_PROXY_TOKEN) is the Worker's own secret, not these.
      # Skipped until the repository has the CLOUDFLARE_API_TOKEN secret (a
      # token from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
      - name: Publicar o site na Cloudflare
        if: steps.publish.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN: o site não foi publicado."
            exit 0
          fi
          npx --yes wrangler@4.155.0 deploy

      - name: Log da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-log
          path: logs/
          retention-days: 14

      - name: Falha em alguma fonte
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::Alguma etapa do daily falhou; veja o log (artefato daily-log)."
          exit 1
